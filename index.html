<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Southeast Pet 2026 Order Builder</title>

<style>
  :root {
    --bg: #f5f5f7;
    --panel: #ffffff;
    --border: #d2d2d7;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --accent-soft: #e1efff;
    --danger: #d70015;
    --ok: #34c759;
  }
  :root[data-theme="dark"] {
    --bg: #111827;
    --panel: #1f2937;
    --border: #4b5563;
    --text: #f9fafb;
    --muted: #cbd5e1;
    --accent: #60a5fa;
    --accent-soft: #1e3a5f;
    --danger: #fb7185;
    --ok: #4ade80;
  }
  :root[data-theme="trapper"] {
    --bg: #16c4d8;
    --panel: #fff7bf;
    --border: #2c1765;
    --text: #21104d;
    --muted: #543e7d;
    --accent: #e6007e;
    --accent-soft: #ffc7eb;
    --danger: #d71920;
    --ok: #008f61;
  }
  :root[data-theme="trapper"] body,
  :root[data-theme="trapper"] main {
    background-color: #16c4d8;
    background-image:
      radial-gradient(circle at 8% 12%, #fff34b 0 9px, transparent 10px),
      radial-gradient(circle at 91% 18%, #ff6eb4 0 15px, transparent 16px),
      linear-gradient(125deg, transparent 0 43%, rgba(102, 45, 145, 0.35) 44% 48%, transparent 49%),
      linear-gradient(35deg, transparent 0 70%, rgba(255, 243, 75, 0.55) 71% 75%, transparent 76%);
    background-size: 90px 90px, 120px 120px, 160px 160px, 180px 180px;
  }
  :root[data-theme="trapper"] header,
  :root[data-theme="trapper"] nav.sidebar,
  :root[data-theme="trapper"] .buyer-header,
  :root[data-theme="trapper"] .toolbar,
  :root[data-theme="trapper"] #masterPanel.master-page {
    border-width: 3px;
    box-shadow: 5px 5px 0 #2c1765;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
    height: 100%;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; flex: 1; min-width: 0; }
  .header-total { font-size: 16px; font-weight: 700; color: var(--text); margin-left: 10px; padding: 6px 12px; background: var(--accent-soft); border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .header-total#headerList { background: rgba(0, 0, 0, 0.04); }
  .save-state { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  .theme-switch {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
  }
  .theme-switch button {
    min-height: 30px;
    padding: 5px 8px;
    border: 0;
    border-right: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .theme-switch button:last-child { border-right: 0; }
  .theme-switch button[aria-pressed="true"] {
    background: var(--accent);
    color: #fff;
  }

  .layout { display: flex; flex: 1; overflow: hidden; min-height: 0; }
  nav.sidebar {
    width: 240px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
  }
  nav.sidebar h2 {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 14px 6px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  nav.sidebar ul { list-style: none; padding: 0; margin: 0; }
  nav.sidebar li button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 14px;
    font-size: 15px;
    color: var(--text);
    border-left: 3px solid transparent;
    cursor: pointer;
  }
  nav.sidebar li button.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  nav.sidebar li button.has-input {
    box-shadow: inset 3px 0 0 var(--ok);
  }
  nav.sidebar li button.master-btn,
  nav.sidebar li button.master-btn.active {
    width: calc(100% - 16px);
    margin: 6px 8px 12px;
    padding: 12px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    text-align: center;
    font-size: 16px;
    font-weight: 700;
  }
  nav.sidebar li button.master-btn.active {
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  #masterPanel { padding: 12px 14px; border-bottom: 1px solid var(--border); background: #fafafa; }
  #masterPanel .mp-label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin-top: 8px; margin-bottom: 4px; letter-spacing: 0.3px; }
  #masterPanel input[type="text"], #masterPanel input:not([type]) {
    width: 100%; padding: 7px 10px; font-size: 14px; border: 1px solid var(--border); border-radius: 6px; background: #fff; margin-bottom: 4px;
  }
  #masterPanel .mp-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  #masterPanel .mp-table th, #masterPanel .mp-table td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--border); }
  #masterPanel .mp-table th { font-weight: 600; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
  #masterPanel .mp-table td.mp-num, #masterPanel .mp-table th.mp-num { text-align: right; font-variant-numeric: tabular-nums; }
  #masterPanel .mp-table input[type="checkbox"] { transform: scale(1.2); cursor: pointer; }
  #masterPanel .mp-items-title { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; letter-spacing: 0.3px; }
  #masterPanel .mp-items-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #masterPanel .mp-items-table th, #masterPanel .mp-items-table td { padding: 5px 4px; text-align: left; border-bottom: 1px solid var(--border); }
  #masterPanel .mp-items-table th { font-weight: 600; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
  #masterPanel .mp-items-table td.mp-num, #masterPanel .mp-items-table th.mp-num { text-align: right; }
  #masterPanel .mp-items-table input[type="number"] { width: 50px; padding: 2px 4px; font-size: 12px; text-align: center; border: 1px solid var(--border); border-radius: 4px; }
  #masterPanel .mp-items-table .mp-del { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 16px; padding: 0 4px; }
  #masterPanel .mp-items-table .mp-del:hover { color: #b30010; }
  #masterPanel.master-page { background: #fff; border-radius: 10px; padding: 18px 22px; margin: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); max-width: 1100px; }
  #masterPanel.master-page .mp-vendor-title { font-size: 22px; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--accent); }
  #masterPanel.master-page .mp-items-title { font-size: 14px; margin-top: 20px; }
  #masterPanel.master-page .mp-table { font-size: 14px; }
  #masterPanel.master-page .mp-items-table { font-size: 14px; }

  #masterPanel .mp-toggle { display: flex; align-items: center; gap: 10px; margin: 12px 0 6px; }
  #masterPanel .mp-toggle-label { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: 0.3px; }
  #masterPanel .mp-toggle-switch { background: var(--accent); color: #fff; border: 0; padding: 6px 14px; border-radius: 16px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  #masterPanel .mp-toggle-switch[data-pressed="false"] { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  #masterPanel .mp-table th.mp-hide-col { text-align: center; }
  #masterPanel .mp-table td.mp-hide-col { text-align: center; }

  #masterPanel.master-page { background: var(--panel); }
  #masterInstructions.instructions-link {
    padding: 6px 12px;
    margin: 0 0 16px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  #masterInstructions.instructions-link:hover { filter: brightness(1.05); }
  .instructions-modal { max-width: 620px; }
  .instructions-modal ol { padding-left: 22px; line-height: 1.5; }
  .instructions-modal li { margin: 8px 0; }
  .instructions-modal .tip {
    padding: 10px 12px;
    border-left: 4px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
  }
  nav.sidebar li button.active {
    background: var(--accent-soft);
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  nav.sidebar li button.has-input {
    box-shadow: inset 3px 0 0 var(--ok);
  }

  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    background: var(--bg);
  }

  .vendor-header {
    background: #fff;
    border: 1px solid #d2d2d7;
    color: #1d1d1f;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .vendor-header h2 { margin: 0 0 6px; font-size: 20px; }
  .vendor-header .pages { font-size: 13px; color: #6e6e73; margin-bottom: 10px; }
  .vendor-header label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: #6e6e73;
    margin-top: 10px;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  .vendor-title-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .vendor-title-row h2 { margin: 0; font-size: 20px; }

  .page-block {
    background: #fff;
    border: 1px solid #d2d2d7;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .page-block .page-title { font-size: 13px; color: #6e6e73; margin-bottom: 8px; }
  .page-canvas-wrap {
    position: relative;
    width: 100%;
    background: #fff;
    border: 1px solid #d2d2d7;
    overflow: hidden;
  }
  .page-canvas-wrap canvas { display: block; width: 100%; height: auto; }
  .qty-overlay {
    position: absolute;
    background: rgba(255, 235, 59, 0.6);
    border: 2px solid #f9a825;
    border-radius: 3px;
    color: #1d1d1f;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    line-height: 1;
    padding: 0;
    -moz-appearance: textfield;
    z-index: 10;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.6);
  }
  .qty-overlay:hover { background: rgba(255, 235, 59, 0.9); border-color: #c17900; }
  .qty-overlay:focus { background: rgba(255, 235, 59, 1); border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent); }
  .qty-overlay::-webkit-outer-spin-button,
  .qty-overlay::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .qty-overlay.has-value { background: rgba(52, 199, 89, 0.6); border-color: var(--ok); color: #fff; }

  .buyer-overlay {
    position: absolute;
    z-index: 10;
    padding: 0 4px;
    border: 0;
    background: rgba(255, 255, 255, 0.78);
    color: #1d1d1f;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
    height: 30px !important;
    transform: translateY(-9px);
    text-align: left;
  }
  .buyer-overlay:focus { outline: none; }

  .fromm-text-overlay {
    position: absolute;
    z-index: 11;
    padding: 0 3px;
    border: 1px solid #f9a825;
    border-radius: 2px;
    background: rgba(255, 235, 59, 0.6);
    color: #0a4ec9;
    font-family: "Courier New", Courier, monospace;
    font-size: 11px;
    font-weight: 700;
    text-align: left;
  }
  .fromm-form-text-overlay {
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
  }
  .fromm-qty-overlay {
    font-size: 18px !important;
    font-weight: 800;
    line-height: 1;
    text-align: center !important;
  }
  .fromm-text-overlay::placeholder { color: #7a6500; opacity: 1; }
  .fromm-text-overlay:focus {
    background: rgba(255, 235, 59, 1);
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .fromm-checkbox-overlay {
    position: absolute;
    z-index: 11;
    appearance: none;
    margin: 0;
    padding: 0;
    border: 1px solid #b8860b;
    border-radius: 2px;
    background: rgba(255, 235, 59, 0.6);
    cursor: pointer;
  }
  .fromm-checkbox-overlay:checked {
    background: rgba(255, 235, 59, 0.6);
    border-color: #b8860b;
  }
  .fromm-checkbox-overlay:checked::after {
    content: "✕";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #b8000a;
    font-family: "Courier New", Courier, monospace;
    font-weight: 900;
    line-height: 1;
    pointer-events: none;
  }
  .fromm-checkbox-overlay:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .vendor-note-overlay {
    position: absolute;
    z-index: 11;
    appearance: none;
    padding: 0 3px;
    border: 2px solid #f9a825;
    border-radius: 4px;
    background: rgba(255, 235, 59, 0.6);
    color: #0a4ec9;
    font-family: "Courier New", Courier, monospace;
    font-size: 8pt;
    font-weight: 700;
    text-align: left;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.7);
  }
  .vendor-note-overlay::placeholder { color: #7a6500; opacity: 1; }
  .vendor-note-overlay:focus {
    background: rgba(255, 235, 59, 1);
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 2px var(--accent);
  }

  .toolbar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .toolbar button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    min-height: 44px;
  }
  .toolbar button.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .toolbar button.danger { background: var(--danger); }
  .toolbar .total { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; }
  .toolbar .total .label { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.3px; }
  .toolbar .total .amount { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .toolbar .total .amount.below-min { color: var(--danger); }
  .toolbar .total .min-warn { font-size: 11px; color: var(--danger); }

  .buyer-header {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .buyer-header label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }
  .buyer-header input {
    width: 100%;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
  }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; padding: 20px; max-width: 500px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-top: 0; }
  .modal .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 2000;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .sidebar-toggle { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 14px; cursor: pointer; }

  @media (max-width: 720px) {
    nav.sidebar {
      position: fixed; top: 0; bottom: 0; left: 0;
      width: 80%; max-width: 320px; z-index: 500;
      transform: translateX(-100%);
      transition: transform 0.2s;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }
    nav.sidebar.open { transform: translateX(0); }
    .buyer-header { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle vendor list">☰</button>
  <h1>SE Pet 2026 Order</h1>
  <span class="header-total" id="headerList">List: $0.00</span>
  <span class="header-total header-net" id="headerTotal">Net: $0.00</span>
  <div class="theme-switch" id="themeSwitch" role="group" aria-label="Display theme">
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
    <button type="button" data-theme="trapper" aria-pressed="false">Trapper Keeper</button>
  </div>
  <span class="save-state" id="saveState">Loading…</span>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <ul id="vendorList"></ul>
  </nav>
  <main id="main"></main>
<template id="masterPanelTemplate">
  <section id="masterPanel" class="master-page">
    <h2 class="mp-vendor-title">Master Order Summary</h2>
    <div><button type="button" class="instructions-link" id="masterInstructions">How to use this app</button></div>
    <div class="mp-toggle">
      <label class="mp-toggle-label" for="m-show-all">Show all vendors</label>
      <button type="button" class="mp-toggle-switch" id="m-show-all" role="switch" aria-checked="true" data-pressed="true">All / Visible</button>
    </div>
    <table class="mp-table">
      <thead><tr><th>Vendor</th><th class="mp-num">List Subtotal</th><th class="mp-num">Net Subtotal</th><th class="mp-hide-col" title="Hide from sidebar">Hide</th></tr></thead>
      <tbody id="m-table-body"></tbody>
    </table>

    <h3 class="mp-items-title">Order Items</h3>
    <table class="mp-items-table">
      <thead><tr><th>UPC</th><th>Description</th><th class="mp-num">Qty</th><th>×</th></tr></thead>
      <tbody id="m-items-body"></tbody>
    </table>
  </section>
</template>

</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<script src="vendor/pdfjs/pdf-umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
